name: ✨ 功能建议
description: 想要新灯效、新集成，或对现有行为有改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先想一件事：这个项目刻意保持**单机、零构建、依赖极少**。
        引入框架、打包器或大依赖的建议，大概率会被拒绝 —— 但如果你有充分理由，欢迎说服我。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接给方案。
      placeholder: |
        我晚上写代码时灯太亮，每次都要手动拖亮度。希望它能跟随系统时间自动切换。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 有具体想法就写，没有也可以只写问题。
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: 属于哪一类
      options:
        - 新灯效
        - 与其它软件联动（游戏 / 音乐 / 系统事件……）
        - 界面与交互
        - 性能
        - 命令行工具
        - 文档与教程
        - 硬件兼容性
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 例如现有灯效、SignalRGB、OpenRGB 自带界面等，为什么不够用。
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该功能在**不需要额外硬件**的前提下可以实现（如果需要买硬件，请说明）
          required: false
        - label: 我愿意接受它可能只在特定硬件上可用
          required: false
