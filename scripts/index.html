<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机箱灯光控制台 · Light Console</title>
<script>
/* 主题在首帧前就定下来，避免白/黑闪烁 */
(function(){
  try{
    var t = localStorage.getItem('light_console_theme');
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<style>
/* ============ Design Tokens ============ */
:root{
  color-scheme:dark;
  --bg:#06080c;
  --surface:#0e1219;
  --surface-2:#121722;
  --surface-3:#161c29;
  --line:#1e2634;
  --line-soft:#171d28;
  --line-hover:#2c374a;
  --text:#e9eff8;
  --text-2:#aab6c6;
  --muted:#6f7d90;
  --accent:#37c5ff;
  --accent-2:#8b5cf6;
  --success:#2fd48a;
  --danger:#ff4d5e;

  --page-bg:
    radial-gradient(1100px 620px at 8% -12%, rgba(55,197,255,.13), transparent 62%),
    radial-gradient(900px 560px at 96% -4%, rgba(139,92,246,.13), transparent 60%),
    radial-gradient(700px 500px at 50% 120%, rgba(47,212,138,.05), transparent 70%),
    var(--bg);

  --edge:rgba(255,255,255,.14);
  --edge-soft:rgba(255,255,255,.09);
  --field-bg:#0a0e15;
  --track:#202834;
  --switch-off:#242c3a;
  --switch-knob:#8494a8;
  --band-base:#141a24;
  --overlay:rgba(3,5,9,.74);
  --picker-grad:linear-gradient(180deg,#151b26,#0e1219);
  --picker-line:#29334a;
  --mode-active-bg:linear-gradient(160deg,rgba(55,197,255,.18),rgba(139,92,246,.16));
  --on-accent:#06121a;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:28px;

  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-3:0 24px 64px -16px rgba(0,0,0,.75);
  --glow:0 0 0 1px rgba(55,197,255,.35), 0 8px 28px -8px rgba(55,197,255,.45);
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ============ 白日模式 ============ */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#eef2f8;
  --surface:#ffffff;
  --surface-2:#fbfcfe;
  --surface-3:#f3f6fa;
  --line:#dee5ef;
  --line-soft:#eaeff6;
  --line-hover:#c3cfdf;
  --text:#0d1526;
  --text-2:#465670;
  --muted:#78859a;
  --accent:#0284c7;
  --accent-2:#7c3aed;
  --success:#0f9d63;
  --danger:#d92d45;

  --page-bg:
    radial-gradient(1100px 620px at 8% -12%, rgba(2,132,199,.10), transparent 62%),
    radial-gradient(900px 560px at 96% -4%, rgba(124,58,237,.09), transparent 60%),
    radial-gradient(700px 500px at 50% 120%, rgba(15,157,99,.05), transparent 70%),
    var(--bg);

  --edge:rgba(13,21,38,.14);
  --edge-soft:rgba(13,21,38,.08);
  --field-bg:#ffffff;
  --track:#d9e2ee;
  --switch-off:#d3dbe6;
  --switch-knob:#ffffff;
  --band-base:#e6ecf4;
  --overlay:rgba(15,23,42,.38);
  --picker-grad:linear-gradient(180deg,#ffffff,#f4f8fd);
  --picker-line:#d5deea;
  --mode-active-bg:linear-gradient(160deg,rgba(2,132,199,.14),rgba(124,58,237,.12));
  --on-accent:#ffffff;

  --shadow-1:0 1px 2px rgba(15,23,42,.08);
  --shadow-3:0 24px 64px -18px rgba(15,23,42,.28);
  --glow:0 0 0 1px rgba(2,132,199,.45), 0 8px 24px -10px rgba(2,132,199,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--page-bg);
  color:var(--text);
  font:14px/1.55 "Inter","Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:var(--s-6) var(--s-5) var(--s-6);
  min-height:100vh;
  transition:background .3s var(--ease), color .3s var(--ease);
}
.shell{max-width:1180px;margin:0 auto}

/* ============ Top bar ============ */
.topbar{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-6)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:var(--on-accent);
  box-shadow:0 8px 22px -8px rgba(55,197,255,.7);
}
.brand-mark svg{width:21px;height:21px}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.pills{display:flex;gap:var(--s-2);flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  height:32px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:12px;color:var(--text-2);white-space:nowrap;
  transition:border-color .2s var(--ease), color .2s var(--ease);
}
.pill b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.3s}
.pill .dot.on{background:var(--success);box-shadow:0 0 10px rgba(47,212,138,.9)}
.pill .dot.off{background:var(--danger);box-shadow:0 0 10px rgba(255,77,94,.9)}
.pill.is-live{border-color:rgba(55,197,255,.4);color:var(--text)}
.pill .meta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

/* ============ Layout ============ */
.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--s-4)}
@media(max-width:940px){.layout{grid-template-columns:1fr}}
.panel{
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s-5);
}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--s-4)}
.panel-head h2{
  margin:0;font-size:11.5px;font-weight:650;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.panel-head .hint{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}

/* ============ Mode tiles ============ */
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2)}
@media(max-width:520px){.mode-grid{grid-template-columns:repeat(2,1fr)}}
.mode{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:13px 4px 11px;border-radius:var(--r-md);
  background:var(--surface-3);border:1px solid var(--line);
  color:var(--text-2);cursor:pointer;font-family:inherit;font-size:12px;
  transition:transform .18s var(--ease),border-color .18s var(--ease),
             background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
}
.mode svg{width:20px;height:20px;opacity:.85}
.mode:hover{transform:translateY(-2px);border-color:var(--line-hover);color:var(--text)}
.mode:active{transform:translateY(0)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode[aria-pressed="true"]{
  background:var(--mode-active-bg);
  border-color:rgba(55,197,255,.55);color:var(--text);box-shadow:var(--glow);
}
.mode[aria-pressed="true"] svg{opacity:1}

/* ============ Sliders ============ */
.controls{margin-top:var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.field{display:grid;grid-template-columns:56px 1fr 46px;align-items:center;gap:var(--s-3)}
.field > label{font-size:12px;color:var(--muted)}
.field output{
  font-size:12px;color:var(--text);text-align:right;
  font-variant-numeric:tabular-nums;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,50%),
             var(--track) var(--fill,50%),var(--track) 100%);
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:0;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.6);
  transition:transform .15s var(--ease);
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* ============ Color block ============ */
.color-row{display:flex;align-items:center;gap:var(--s-3)}
.swatch-lg{
  width:96px;height:56px;border-radius:var(--r-md);flex:0 0 auto;cursor:pointer;
  border:1px solid var(--edge);position:relative;
  box-shadow:inset 0 0 30px rgba(0,0,0,.45), var(--shadow-1);
  transition:transform .18s var(--ease),border-color .18s var(--ease);
}
.swatch-lg:hover{transform:scale(1.03);border-color:var(--edge)}
.swatch-lg:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.swatch-lg::after{
  content:"调色";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;
  font-size:11px;opacity:0;transition:opacity .18s var(--ease);letter-spacing:.06em;
  white-space:nowrap;pointer-events:none;
}
.swatch-lg:hover::after{opacity:1}
.hex-input{
  flex:1;min-width:0;height:44px;padding:0 13px;border-radius:var(--r-sm);
  background:var(--field-bg);border:1px solid var(--line);color:var(--text);
  font:13px/1 ui-monospace,"JetBrains Mono",Consolas,monospace;letter-spacing:.06em;
  outline:none;transition:border-color .18s var(--ease),background .3s var(--ease);
}
.hex-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(55,197,255,.12)}

.presets{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-4)}
.preset{
  width:32px;height:32px;border-radius:9px;cursor:pointer;
  border:1px solid var(--edge-soft);
  transition:transform .16s var(--ease),border-color .16s var(--ease);
}
.preset:hover{transform:translateY(-2px) scale(1.05);border-color:var(--edge)}
.preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ Screen bands ============ */
.bands-block{margin-top:var(--s-5)}
.bands-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.bands-head span{font-size:11.5px;color:var(--muted)}
.bands-head .live{
  margin-left:auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--success);opacity:0;transition:opacity .25s var(--ease);
}
.bands-head .live.on{opacity:1}
.bands{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bands i{flex:1;background:var(--band-base);transition:background .12s linear}
.bands.idle{opacity:.35}

/* ============ Zones ============ */
.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-3)}
@media(max-width:720px){.zones{grid-template-columns:1fr}}
.zone{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;transition:border-color .2s var(--ease),opacity .2s var(--ease);
}
.zone:hover{border-color:var(--line-hover)}
.zone.is-off{opacity:.5}
.zone-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.zone-id{min-width:0;flex:1}
.zone-name{font-size:13px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-meta{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.switch{
  position:relative;width:42px;height:24px;border-radius:99px;flex:0 0 auto;cursor:pointer;
  background:var(--switch-off);border:1px solid var(--line);
  transition:background .22s var(--ease),border-color .22s var(--ease);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--switch-knob);box-shadow:0 1px 3px rgba(0,0,0,.35);
  transition:transform .22s var(--ease),background .22s var(--ease);
}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.zone-body{display:flex;align-items:center;gap:10px}
.chip{
  width:46px;height:34px;border-radius:9px;flex:0 0 auto;cursor:pointer;
  border:1px solid var(--edge);
  transition:transform .16s var(--ease),border-color .16s var(--ease);
}
.chip:hover{transform:scale(1.06);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zone-body .spacer{flex:1}
.num{
  width:62px;height:32px;padding:0 8px;border-radius:8px;text-align:center;
  background:var(--field-bg);border:1px solid var(--line);color:var(--text-2);
  font:12px/1 ui-monospace,Consolas,monospace;outline:none;
  transition:border-color .18s var(--ease),color .18s var(--ease),background .3s var(--ease);
}
.num:focus{border-color:var(--accent);color:var(--text)}
.cal{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line-soft)}
.cal > span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.cal input[type=range]{height:4px}
.cal output{font-size:11px;color:var(--text-2);min-width:26px;text-align:right;
  font-variant-numeric:tabular-nums}

/* ============ Footer ============ */
.foot{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  margin-top:var(--s-5);font-size:11.5px;color:var(--muted)}
.foot .kbd{
  display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--line);
  background:var(--surface);font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
}
.btn{
  height:34px;padding:0 14px;border-radius:9px;cursor:pointer;font:12.5px inherit;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease);
}
.btn:hover{border-color:var(--line-hover);color:var(--text);background:var(--surface-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot .err{color:var(--danger)}
.foot .push{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ============ Picker modal ============ */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:flex-start;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(10px);
  padding:18px;overflow:auto;
}
.modal.open{display:flex}
.picker{
  width:min(700px,100%);margin:auto;
  background:var(--picker-grad);
  border:1px solid var(--picker-line);border-radius:var(--r-xl);
  padding:var(--s-5);box-shadow:var(--shadow-3);
  animation:pop .2s var(--ease);
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.pk-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:var(--s-4)}
.pk-title{font-size:14px;font-weight:650}
.pk-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.pk-x{
  margin-left:auto;width:30px;height:30px;flex:0 0 auto;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--muted);
  font-size:15px;line-height:1;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.pk-x:hover{color:var(--text);border-color:var(--line-hover)}
.pk-body{display:grid;grid-template-columns:288px 1fr;gap:var(--s-5);align-items:start}
@media(max-width:740px){.pk-body{grid-template-columns:1fr}}
#wheel{touch-action:none;cursor:crosshair;display:block}
.pk-preview{height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  transition:background .06s linear}
.pk-fields{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:var(--s-2);margin-top:var(--s-3)}
.pk-fields .f label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em}
.pk-fields .f input{
  width:100%;height:34px;padding:0 9px;border-radius:8px;outline:none;
  background:var(--field-bg);border:1px solid var(--line);color:var(--text);
  font:12.5px/1 ui-monospace,Consolas,monospace;
}
.pk-fields .f input:focus{border-color:var(--accent)}
.pk-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:650;margin:var(--s-4) 0 var(--s-2)}
.pal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.pal i{aspect-ratio:1;border-radius:5px;cursor:pointer;border:1px solid var(--edge-soft);
  transition:transform .12s var(--ease),border-color .12s var(--ease)}
.pal i:hover{transform:scale(1.2);border-color:var(--accent);position:relative;z-index:2}
.pal i:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.recent{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.recent i{width:26px;height:26px;border-radius:7px;cursor:pointer;
  border:1px solid var(--edge-soft);transition:transform .12s var(--ease)}
.recent i:hover{transform:scale(1.12)}
.recent .empty{font-size:11.5px;color:var(--muted)}
.pk-actions{display:flex;gap:10px;margin-top:var(--s-5)}
.pk-actions button{flex:1;height:40px;border-radius:10px;cursor:pointer;font:13px inherit;
  border:1px solid var(--line);background:var(--surface-3);color:var(--text-2);
  transition:.18s var(--ease)}
.pk-actions button:hover{color:var(--text);border-color:var(--line-hover)}
.pk-actions .primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;font-weight:650;
  box-shadow:0 10px 26px -10px rgba(55,197,255,.75);
}
.pk-actions .primary:hover{filter:brightness(1.08)}

/* ============ 首次运行向导 ============ */
.wizard{
  width:min(780px,100%);margin:auto;
  background:var(--picker-grad);border:1px solid var(--picker-line);
  border-radius:var(--r-xl);padding:var(--s-5);box-shadow:var(--shadow-3);
  animation:pop .2s var(--ease);
}
.wz-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:var(--s-4)}
.wz-step{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
.wz-title{font-size:16px;font-weight:650;margin-top:3px}
.wz-body{max-height:min(58vh,520px);overflow:auto;padding-right:4px}
.wz-card{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:10px;
}
.wz-kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:12.5px}
.wz-kv dt{color:var(--muted)}
.wz-kv dd{margin:0;color:var(--text);word-break:break-all}
.wz-note{font-size:12px;color:var(--muted);line-height:1.7}
.wz-zone{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:10px;
}
.wz-zone-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wz-zone-name{flex:1;min-width:0;font-size:13px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz-zone-meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wz-zone-body{display:flex;align-items:center;gap:10px}
.wz-zone-body .num{width:70px}
.wz-acts{display:flex;gap:10px;margin-top:var(--s-5)}
.wz-acts button{flex:1;height:40px;border-radius:10px;cursor:pointer;font:13px inherit;
  border:1px solid var(--line);background:var(--surface-3);color:var(--text-2);
  transition:.18s var(--ease)}
.wz-acts button:hover:not(:disabled){color:var(--text);border-color:var(--line-hover)}
.wz-acts button:disabled{opacity:.4;cursor:not-allowed}
.wz-acts .primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;font-weight:650;
  box-shadow:0 10px 26px -10px rgba(55,197,255,.75);
}
.wz-acts .primary:hover{filter:brightness(1.08)}

/* ============ 主题切换 ============ */
.theme-toggle{
  width:32px;height:32px;flex:0 0 auto;border-radius:999px;cursor:pointer;
  display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);

html[data-theme="light"] .theme-toggle .ic-sun{display:block}
html[data-theme="light"] .theme-toggle .ic-moon{display:none}
</style>
</head>

<script>
"use strict";
const $ = (s) => document.querySelector(s);

/* ================= 灯效定义 ================= */
const ICON = {
  static:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12h6"/>',
  rainbow:'<circle cx="12" cy="12" r="8"/><path d="M12 4v8l5.7 5.7"/>',
  breathe:'<circle cx="12" cy="12" r="3"/><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/>',
  chase:'<path d="M3 12h11l-3-3M14 12l-3 3"/><path d="M17 8h4M17 16h4"/>',
  wave:'<path d="M2 12c2.5-5 5-5 7.5 0S17 17 22 12"/>',
  gpu:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h3M8 14h6"/><path d="M20 10h2M20 14h2"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  off:'<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>'
};
const MODES = [
  { key:'static',  name:'静态',   hint:'纯色常亮' },
  { key:'rainbow', name:'彩虹',   hint:'色相流动' },
  { key:'breathe', name:'呼吸',   hint:'明暗起伏' },
  { key:'chase',   name:'流光',   hint:'彗尾追逐' },
  { key:'wave',    name:'波浪',   hint:'色波推进' },
  { key:'gpu',     name:'GPU 联动', hint:'温度→色相 · 占用→亮度' },
  { key:'screen',  name:'屏幕同步', hint:'跟随屏幕横向配色' },
  { key:'off',     name:'关闭',   hint:'全部熄灭' }
];

const state = { mode:'static', color:'#00a8ff', brightness:100, speed:5, zones:{}, leds:{} };
const pendingToggle = new Set();
const pendingLeds = new Set();
let ledTimer = null, ledDragging = false;

/* ================= 颜色工具 ================= */
function hexNorm(v){
  v = String(v||'').trim().replace(/^#/,'');
  if(/^[0-9a-fA-F]{3}$/.test(v)) v = v.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(v)) return null;
  return '#'+v.toLowerCase();
}
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join('');
}
function hexToRgb(h){
  const n = hexNorm(h) || '#000000';
  return { r:parseInt(n.slice(1,3),16), g:parseInt(n.slice(3,5),16), b:parseInt(n.slice(5,7),16) };
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d!==0){
    if(mx===r) h=((g-b)/d)%6;
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return { h, s: mx===0?0:d/mx, v: mx };
}
function hsvToRgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return { r:Math.round((r+m)*255), g:Math.round((g+m)*255), b:Math.round((b+m)*255) };
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return rgbToHex((r+m)*255,(g+m)*255,(b+m)*255);
}

/* ================= 色轮 ================= */
const SIZE=288, CX=SIZE/2, CY=SIZE/2, R_OUT=140, R_IN=116, R_MID=(R_OUT+R_IN)/2, SQ=80;
const canvas = $('#wheel');
const ctx = canvas.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = SIZE*dpr; canvas.height = SIZE*dpr;
canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px';
ctx.scale(dpr,dpr);
let hsv = { h:200, s:1, v:1 };

function drawWheel(){
  ctx.clearRect(0,0,SIZE,SIZE);
  for(let a=0;a<360;a++){
    ctx.beginPath();
    ctx.arc(CX,CY,R_MID,(a-0.6)*Math.PI/180,(a+1.2)*Math.PI/180);
    ctx.strokeStyle='hsl('+a+' 100% 50%)';
    ctx.lineWidth=R_OUT-R_IN;
    ctx.stroke();
  }
  const rgb = hsvToRgb(hsv.h,1,1);
  const x0=CX-SQ, y0=CY-SQ, w=SQ*2, rr=10;
  ctx.save();
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x0,y0,w,w,rr); else ctx.rect(x0,y0,w,w);
  ctx.clip();
  ctx.fillStyle='rgb('+rgb.r+','+rgb.g+','+rgb.b+')';
  ctx.fillRect(x0,y0,w,w);
  let g = ctx.createLinearGradient(x0,0,x0+w,0);
  g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(x0,y0,w,w);
  g = ctx.createLinearGradient(0,y0,0,y0+w);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000');
  ctx.fillStyle=g; ctx.fillRect(x0,y0,w,w);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x0,y0,w,w,rr); else ctx.rect(x0,y0,w,w);
  ctx.stroke();

  const ha=hsv.h*Math.PI/180;
  ctx.beginPath(); ctx.arc(CX+Math.cos(ha)*R_MID, CY+Math.sin(ha)*R_MID, 9, 0, Math.PI*2);
  ctx.fillStyle='hsl('+hsv.h+' 100% 50%)'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();

  const px=CX+(hsv.s*2-1)*SQ, py=CY+(1-hsv.v*2)*SQ;
  ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2);
  ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2);
  ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.stroke();
}

let dragMode = null;
function pickFromEvent(ev){
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX-rect.left)*(SIZE/rect.width);
  const y = (ev.clientY-rect.top )*(SIZE/rect.height);
  const dx=x-CX, dy=y-CY, dist=Math.hypot(dx,dy);
  if(dragMode===null){
    if(dist>=R_IN-8 && dist<=R_OUT+8) dragMode='hue';
    else if(Math.abs(dx)<=SQ && Math.abs(dy)<=SQ) dragMode='sv';
    else return;
  }
  if(dragMode==='hue'){
    let a=Math.atan2(dy,dx)*180/Math.PI; if(a<0) a+=360; hsv.h=a;
  }else{
    hsv.s=clamp((dx/SQ+1)/2,0,1);
    hsv.v=clamp((1-dy/SQ)/2,0,1);
  }
  const c=hsvToRgb(hsv.h,hsv.s,hsv.v);
  onColorChange(rgbToHex(c.r,c.g,c.b));
}
canvas.addEventListener('pointerdown', e=>{
  dragMode=null;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pickFromEvent(e);
});
canvas.addEventListener('pointermove', e=>{ if(e.buttons===0||dragMode===null) return; pickFromEvent(e); });
canvas.addEventListener('pointerup', e=>{ dragMode=null; try{ canvas.releasePointerCapture(e.pointerId); }catch(_){} });
canvas.addEventListener('pointercancel', ()=>{ dragMode=null; });

/* ================= 调色盘 / 最近 ================= */
const RECENT_KEY='light_recent_colors';
const loadRecent = () => { try{ return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]'); }catch(_){ return []; } };
function pushRecent(hex){
  let arr = loadRecent().filter(c=>c!==hex);
  arr.unshift(hex); arr = arr.slice(0,14);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); }catch(_){}
  renderRecent();
}
function renderRecent(){
  const box=$('#recent'); const arr=loadRecent();
  box.innerHTML = arr.length ? '' : '<span class="empty">还没有记录</span>';
  arr.forEach(c=>{
    const i=document.createElement('i');
    i.style.background=c; i.title=c.toUpperCase(); i.tabIndex=0;
    i.onclick=()=>applyHex(c);
    box.appendChild(i);
  });
}
function buildPalette(){
  const box=$('#pal'); box.innerHTML='';
  const hues=[0,25,50,75,100,125,150,175,200,225,250,275,300,325];
  const rows=[{s:100,l:50},{s:100,l:38},{s:75,l:52},{s:45,l:58},{s:100,l:72}];
  rows.forEach(row=>hues.forEach(h=>{
    const col=hslToHex(h,row.s,row.l);
    const i=document.createElement('i');
    i.style.background=col; i.title=col.toUpperCase(); i.tabIndex=0;
    i.onclick=()=>applyHex(col);
    box.appendChild(i);
  }));
  ['#000000','#111111','#222222','#3a3a3a','#555555','#6f6f6f',
   '#8a8a8a','#a5a5a5','#c0c0c0','#dadada','#f0f0f0','#ffffff','#0a0f1a','#101826']
   .forEach(gv=>{
    const i=document.createElement('i');
    i.style.background=gv; i.title=gv.toUpperCase(); i.tabIndex=0;
    i.onclick=()=>applyHex(gv);
    box.appendChild(i);
  });
}

/* ================= 弹窗 ================= */
const pk = { open:false, target:'global', original:null, current:'#00a8ff' };
function syncPickerFields(hex){
  const c=hexToRgb(hex);
  $('#pkHex').value = hex.replace('#','').toUpperCase();
  $('#pkR').value=c.r; $('#pkG').value=c.g; $('#pkB').value=c.b;
  $('#pkPreview').style.background=hex;
  const h2=rgbToHsv(c.r,c.g,c.b);
  if(Math.abs(h2.h-hsv.h)>1e-6||Math.abs(h2.s-hsv.s)>1e-6||Math.abs(h2.v-hsv.v)>1e-6){
    hsv=h2; drawWheel();
  }
}
let sendTimer=null, pendingHex=null;
function onColorChange(hex, immediate){
  pk.current=hex; syncPickerFields(hex); pendingHex=hex;
  if(immediate){
    if(sendTimer){ clearTimeout(sendTimer); sendTimer=null; }
    commitColor(hex); return;
  }
  if(sendTimer) return;
  sendTimer=setTimeout(()=>{ sendTimer=null; if(pendingHex) commitColor(pendingHex); },60);
}
function commitColor(hex){
  if(pk.target==='global'){
    state.color=hex;
    $('#mainSwatch').style.background=hex;
    $('#hex').value=hex.toUpperCase();
  }else{
    state.zones[pk.target]=state.zones[pk.target]||{};
    state.zones[pk.target].color=hex;
    const el=document.querySelector('[data-color="'+pk.target+'"]');
    if(el) el.style.background=hex;
  }
  push();
}
function applyHex(hex){ const n=hexNorm(hex); if(n) onColorChange(n,false); }
function openPicker(target, currentHex, label){
  pk.open=true; pk.target=target; pk.original=currentHex; pk.current=currentHex;
  $('#pkTitle').textContent = target==='global' ? '主色' : '灯区配色';
  $('#pkSub').textContent = label || '';
  const c=hexToRgb(currentHex);
  hsv=rgbToHsv(c.r,c.g,c.b);
  drawWheel(); syncPickerFields(currentHex); renderRecent();
  $('#modal').classList.add('open');
}
function closePicker(){ $('#modal').classList.remove('open'); pk.open=false; }
function cancelPicker(){ commitColor(pk.original); closePicker(); }
$('#pkClose').onclick=cancelPicker;
$('#pkCancel').onclick=cancelPicker;
$('#pkOk').onclick=()=>{ onColorChange(pk.current,true); pushRecent(pk.current); closePicker(); };
$('#modal').addEventListener('pointerdown', e=>{ if(e.target.id==='modal') cancelPicker(); });
$('#pkHex').onchange=()=>{ const n=hexNorm($('#pkHex').value); if(n) onColorChange(n,true); else syncPickerFields(pk.current); };
['pkR','pkG','pkB'].forEach(id=>{
  $('#'+id).oninput=()=>{
    const r=clamp(+$('#pkR').value||0,0,255), g=clamp(+$('#pkG').value||0,0,255), b=clamp(+$('#pkB').value||0,0,255);
    onColorChange(rgbToHex(r,g,b),true);
  };
});
document.addEventListener('keydown', e=>{
  if(!pk.open) return;
  if(e.key==='Escape') cancelPicker();
  if(e.key==='Enter'){ onColorChange(pk.current,true); pushRecent(pk.current); closePicker(); }
});

/* ================= 通信 ================= */
async function post(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return r.json();
}
async function push(){
  const active = document.querySelector('.mode[aria-pressed="true"]');
  if(active) state.mode = active.dataset.mode;
  const res = await post('/api/apply', {
    mode: state.mode,
    color: state.color,
    brightness: +$('#brightness').value,
    speed: +$('#speed').value,
    zones: state.zones,
    leds: state.leds
  });
  if(res.state) render(res.state);
}
function setRangeFill(el){
  const min=+el.min||0, max=+el.max||100;
  el.style.setProperty('--fill', ((+el.value-min)/(max-min)*100)+'%');
}
function scheduleLed(key, value){
  state.leds[key]=clamp(value,0,200);
  pendingLeds.add(key);
  if(ledTimer) clearTimeout(ledTimer);
  ledTimer=setTimeout(()=>{
    ledTimer=null;
    push().finally(()=>pendingLeds.clear());
  },320);
}

/* ================= 渲染 ================= */
function buildModes(){
  const box=$('#modeGrid'); box.innerHTML='';
  MODES.forEach(m=>{
    const b=document.createElement('button');
    b.className='mode'; b.dataset.mode=m.key; b.type='button';
    b.setAttribute('aria-pressed','false');
    b.title=m.hint;
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
                'stroke-linecap="round" stroke-linejoin="round">'+ICON[m.key]+'</svg><span>'+m.name+'</span>';
    b.onclick=()=>{
      state.mode=m.key;
      document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
      const found=MODES.find(x=>x.key===m.key);
      $('#modeHint').textContent = found?found.hint:'';
      push();
    };
    box.appendChild(b);
  });
}

function buildZones(zones){
  const box=$('#zones');
  if(!zones.length){ box.innerHTML='<div style="color:var(--muted)">未检测到灯区</div>'; return; }
  box.innerHTML='';
  zones.forEach(z=>{
    const el=document.createElement('div');
    el.className='zone'+(z.enabled?'':' is-off');
    el.dataset.key=z.key;
    el.innerHTML =
      '<div class="zone-top">'+
        '<div class="zone-id">'+
          '<div class="zone-name" title="'+z.name+'">'+z.name+'</div>'+
          '<div class="zone-meta">'+(state.leds[z.key] ?? z.leds)+' 颗 LED</div>'+
        '</div>'+
        '<div class="switch" role="switch" tabindex="0" aria-checked="'+z.enabled+'" data-sw="'+z.key+'"></div>'+
      '</div>'+
      '<div class="zone-body">'+
        '<div class="chip" role="button" tabindex="0" data-color="'+z.key+'" '+
             'style="background:'+(hexNorm(z.color)||'#000')+'" title="点开调色盘"></div>'+
        '<span class="spacer"></span>'+
        '<input class="num" type="number" min="0" max="200" value="'+(state.leds[z.key] ?? z.leds)+'" '+
               'data-leds="'+z.key+'" title="灯珠数量">'+
      '</div>'+
      '<div class="cal">'+
        '<span>标定</span>'+
        '<input type="range" min="1" max="120" value="'+(state.leds[z.key] ?? z.leds)+'" data-cal="'+z.key+'">'+
        '<output data-calval="'+z.key+'">'+(state.leds[z.key] ?? z.leds)+'</output>'+
      '</div>';
    box.appendChild(el);
  });

  box.querySelectorAll('[data-sw]').forEach(sw=>{
    const toggle=()=>{
      const k=sw.dataset.sw;
      const cur=!!(state.zones[k]&&state.zones[k].enabled);
      const next=!cur;
      state.zones[k]=state.zones[k]||{};
      state.zones[k].enabled=next;
      sw.setAttribute('aria-checked',String(next));
      sw.closest('.zone').classList.toggle('is-off',!next);
      pendingToggle.add(k);
      push().finally(()=>pendingToggle.delete(k));
    };
    sw.onclick=toggle;
    sw.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } };
  });
  box.querySelectorAll('[data-color]').forEach(el=>{
    const open=()=>{
      const k=el.dataset.color;
      const cur=(state.zones[k]&&state.zones[k].color)||state.color;
      const found=zones.find(z=>z.key===k);
      openPicker(k, hexNorm(cur)||'#00a8ff', found?found.name:k);
    };
    el.onclick=open;
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });
  box.querySelectorAll('[data-leds]').forEach(inp=>{
    inp.onchange=()=>{
      const k=inp.dataset.leds;
      const rng=document.querySelector('[data-cal="'+k+'"]');
      if(rng){ rng.value=inp.value; setRangeFill(rng); }
      const lab=document.querySelector('[data-calval="'+k+'"]');
      if(lab) lab.textContent=inp.value;
      scheduleLed(k,+inp.value);
    };
  });
  box.querySelectorAll('[data-cal]').forEach(rng=>{
    setRangeFill(rng);
    rng.addEventListener('pointerdown',()=>{ ledDragging=true; });
    rng.addEventListener('pointerup',()=>{ ledDragging=false; });
    rng.oninput=()=>{
      const k=rng.dataset.cal;
      setRangeFill(rng);
      const lab=document.querySelector('[data-calval="'+k+'"]');
      if(lab) lab.textContent=rng.value;
      const num=document.querySelector('[data-leds="'+k+'"]');
      if(num) num.value=rng.value;
      scheduleLed(k,+rng.value);
    };
  });
}

function renderBands(s){
  const box=$('#bands');
  const live=$('#bandsLive');
  const ok = s.mode==='screen' && s.screen && s.screen.ok && s.screen.bands.length;
  if(ok){
    box.classList.remove('idle');
    live.classList.add('on');
    if(box.children.length!==s.screen.bands.length){
      box.innerHTML=s.screen.bands.map(()=>'<i></i>').join('');
    }
    Array.from(box.children).forEach((el,i)=>{ el.style.background=s.screen.bands[i]; });
  }else{
    box.classList.add('idle');
    live.classList.remove('on');
    if(box.children.length!==16){
      box.innerHTML=Array.from({length:16},()=>'<i></i>').join('');
    }
  }
}

function render(s){
  lastState = s;
  $('#dot').className='dot '+(s.connected?'on':'off');
  $('#devName').textContent=s.device||'未连接';
  // 这里显示的是「RGB 控制器名」，不保证等于主板型号，所以把实际信息一并亮出来
  $('#devMeta').textContent = s.device
    ? ('· ' + (s.device_zones||0) + ' 区 / ' + (s.device_leds||0) + ' 灯')
    : '';
  $('#devPill').title = s.device
    ? ('OpenRGB 枚举到的 RGB 控制器（名称由控制器上报，不一定是主板型号）\n'
       + '名称：' + s.device + '\n'
       + '厂商：' + (s.device_vendor || '—') + '\n'
       + '灯区：' + (s.device_zones||0) + ' 个 / 灯珠：' + (s.device_leds||0) + ' 颗\n'
       + '本轮共枚举到 ' + (s.device_count||0) + ' 个控制器')
    : '未连接';
  $('#fps').textContent=s.fps||0;
  $('#fpsPill').classList.toggle('is-live', !!s.connected);

  const g=s.gpu||{};
  $('#gpuText').textContent = g.ok
    ? ('GPU '+g.temp+'°C · '+g.util+'% · '+g.power+'W')
    : 'GPU 无数据';
  $('#gpuPill').classList.toggle('is-live', !!g.ok && s.mode==='gpu');

  state.mode=s.mode;
  for(const z of s.zones){
    if(pendingLeds.has(z.key)) continue;
    state.leds[z.key]=(s.leds[z.key]!==undefined)?s.leds[z.key]:state.leds[z.key];
    state.zones[z.key]=state.zones[z.key]||{};
    if(!pendingToggle.has(z.key)) state.zones[z.key].enabled=z.enabled;
  }

  document.querySelectorAll('.mode').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.mode===s.mode));
  });
  const hint=MODES.find(x=>x.key===s.mode);
  $('#modeHint').textContent=hint?hint.hint:'';

  if(!pk.open){
    state.color=s.color;
    $('#mainSwatch').style.background=s.color;
    $('#hex').value=s.color.toUpperCase();
  }

  const sig=s.zones.map(z=>z.key).join('|');
  if(!$('#zones').children.length || $('#zones').dataset.sig!==sig){
    $('#zones').dataset.sig=sig;
    buildZones(s.zones);
  }else{
    s.zones.forEach(z=>{
      const el=document.querySelector('[data-color="'+z.key+'"]');
      if(el && !(pk.open && pk.target===z.key)) el.style.background=hexNorm(z.color)||'#000';
      if(!pendingToggle.has(z.key)){
        const sw=document.querySelector('[data-sw="'+z.key+'"]');
        if(sw){
          sw.setAttribute('aria-checked',String(!!z.enabled));
          sw.closest('.zone').classList.toggle('is-off',!z.enabled);
        }
      }
      const num=document.querySelector('[data-leds="'+z.key+'"]');
      if(num && document.activeElement!==num && !ledDragging) num.value=z.leds;
      const rng=document.querySelector('[data-cal="'+z.key+'"]');
      if(rng && !ledDragging){ rng.value=z.leds; setRangeFill(rng); }
      const lab=document.querySelector('[data-calval="'+z.key+'"]');
      if(lab) lab.textContent=z.leds;
      if(el){
        const meta=el.closest('.zone').querySelector('.zone-meta');
        if(meta) meta.textContent=z.leds+' 颗 LED';
      }
    });
  }

  renderBands(s);

  // 首次运行：没做过配置就自动打开向导
  if(!s.setup_done && !wizardShown && s.connected){
    wizardShown = true;
    openWizard();
  }
}

/* ================= 主题 ================= */
const THEME_KEY='light_console_theme';
function currentTheme(){
  return document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(_){}
  const btn=$('#themeToggle');
  if(btn) btn.setAttribute('aria-label', t==='light' ? '切换到黑夜模式' : '切换到白日模式');
}
function initTheme(){
  const btn=$('#themeToggle');
  if(!btn) return;
  btn.setAttribute('aria-label', currentTheme()==='light' ? '切换到黑夜模式' : '切换到白日模式');
  btn.onclick=()=>applyTheme(currentTheme()==='light' ? 'dark' : 'light');
}

/* ================= 首次运行向导 ================= */
let lastState = null;
let wizardStep = 1;
let wizardShown = false;

function openWizard(){
  if(!lastState) return;
  wizardStep = 1;
  renderWizard();
  $('#wizard').classList.add('open');
}
function closeWizard(){
  $('#wizard').classList.remove('open');
  wizardShown = true;
}
function renderWizard(){
  const s = lastState;
  if(!s) return;
  const body = $('#wzBody');
  $('#wzStep').textContent = '第 ' + wizardStep + ' 步 / 共 3 步';

  if(wizardStep === 1){
    $('#wzTitle').textContent = '检测到的控制器';
    body.innerHTML =
      '<div class="wz-card"><dl class="wz-kv">' +
        '<dt>控制器</dt><dd>' + (s.device || '未连接') + '</dd>' +
        '<dt>厂商</dt><dd>' + (s.device_vendor || '—') + '</dd>' +
        '<dt>灯区 / 灯珠</dt><dd>' + (s.device_zones||0) + ' 个灯区 · ' + (s.device_leds||0) + ' 颗灯珠</dd>' +
        '<dt>枚举到的控制器</dt><dd>' + (s.device_count||0) + ' 个</dd>' +
      '</dl></div>' +
      '<div class="wz-card"><div class="wz-note">' +
        '这是 OpenRGB 上报的 <b>RGB 控制器名称</b>，<b>不一定是主板型号</b>。<br>' +
        '本工具按「灯区数优先、灯珠数次之」自动挑选控制器；' +
        '如果你的机器上有多个灯控设备，可以稍后在 <code>config.json</code> 里用 <code>device</code> 字段填名称片段来指定。' +
      '</div></div>';
  }else if(wizardStep === 2){
    $('#wzTitle').textContent = '逐灯区确认';
    body.innerHTML =
      '<div class="wz-note" style="margin-bottom:12px">' +
        '① 关掉没接灯的排针（否则它会占用一帧的数据量）；' +
        '② 拖动「标定」直到该路灯带<b>刚好全部亮起</b>，那个数就是真实灯珠数。' +
      '</div>' +
      (s.zones.length ? s.zones.map(z=>{
        const cur = state.leds[z.key] ?? z.leds;
        return '<div class="wz-zone" data-wz-row="'+z.key+'">' +
          '<div class="wz-zone-top">' +
            '<div class="wz-zone-name" title="'+z.name+'">'+z.name+'</div>' +
            '<div class="wz-zone-meta">'+z.leds+' 颗</div>' +
            '<div class="switch" role="switch" tabindex="0" aria-checked="'+z.enabled+'" data-wz-sw="'+z.key+'"></div>' +
          '</div>' +
          '<div class="wz-zone-body">' +
            '<div class="chip" role="button" tabindex="0" data-wz-color="'+z.key+'" ' +
                 'style="background:'+(hexNorm(z.color)||'#000')+'"></div>' +
            '<span class="wz-zone-meta">灯珠数</span>' +
            '<input class="num" type="number" min="0" max="400" value="'+cur+'" data-wz-leds="'+z.key+'">' +
          '</div>' +
          (z.resizable ? '<div class="cal">' +
            '<span>标定</span>' +
            '<input type="range" min="1" max="200" value="'+cur+'" data-wz-cal="'+z.key+'">' +
            '<output data-wz-calval="'+z.key+'">'+cur+'</output>' +
          '</div>' : '<div class="wz-zone-meta" style="margin-top:8px">单灯区域，无需标定</div>') +
        '</div>';
      }).join('') : '<div class="wz-card"><div class="wz-note">未检测到任何灯区。</div></div>');
    wireWizardZones(body);
  }else{
    $('#wzTitle').textContent = '完成';
    const active = s.zones.filter(z=>z.enabled);
    body.innerHTML =
      '<div class="wz-card"><dl class="wz-kv">' +
        '<dt>启用灯区</dt><dd>' + active.length + ' / ' + s.zones.length + '</dd>' +
        '<dt>合计灯珠</dt><dd>' + active.reduce((n,z)=>n+(state.leds[z.key] ?? z.leds),0) + ' 颗</dd>' +
        '<dt>当前灯效</dt><dd>' + (MODES.find(m=>m.key===s.mode)||{name:s.mode}).name + '</dd>' +
      '</dl></div>' +
      '<div class="wz-card"><div class="wz-note">' +
        '配置会写入 <code>config.json</code>，下次启动自动沿用。' +
        '之后随时可点底部「<b>重新配置</b>」再跑一遍向导。' +
      '</div></div>';
  }

  $('#wzPrev').disabled = (wizardStep === 1);
  $('#wzNext').textContent = (wizardStep === 3) ? '完成并保存' : '下一步';
}

function wireWizardZones(box){
  box.querySelectorAll('[data-wz-sw]').forEach(sw=>{
    const flip = () => {
      const k = sw.dataset.wzSw;
      const cur = !!(state.zones[k] && state.zones[k].enabled);
      const next = !cur;
      state.zones[k] = state.zones[k] || {};
      state.zones[k].enabled = next;
      sw.setAttribute('aria-checked', String(next));
      pendingToggle.add(k);
      push().finally(()=>pendingToggle.delete(k));
    };
    sw.onclick = flip;
    sw.onkeydown = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } };
  });
  box.querySelectorAll('[data-wz-color]').forEach(el=>{
    const open = () => {
      const k = el.dataset.wzColor;
      const cur = (state.zones[k] && state.zones[k].color) || state.color;
      openPicker(k, hexNorm(cur) || '#00a8ff', k);
    };
    el.onclick = open;
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });
  box.querySelectorAll('[data-wz-leds]').forEach(inp=>{
    inp.onchange = () => {
      const k = inp.dataset.wzLeds;
      const rng = box.querySelector('[data-wz-cal="'+k+'"]');
      if(rng){ rng.value = inp.value; setRangeFill(rng); }
      const lab = box.querySelector('[data-wz-calval="'+k+'"]');
      if(lab) lab.textContent = inp.value;
      scheduleLed(k, +inp.value);
    };
  });
  box.querySelectorAll('[data-wz-cal]').forEach(rng=>{
    setRangeFill(rng);
    rng.addEventListener('pointerdown', ()=>{ ledDragging = true; });
    rng.addEventListener('pointerup',   ()=>{ ledDragging = false; });
    rng.oninput = () => {
      const k = rng.dataset.wzCal;
      setRangeFill(rng);
      const lab = box.querySelector('[data-wz-calval="'+k+'"]');
      if(lab) lab.textContent = rng.value;
      const num = box.querySelector('[data-wz-leds="'+k+'"]');
      if(num) num.value = rng.value;
      scheduleLed(k, +rng.value);
    };
  });
}

async function wizardNext(){
  if(wizardStep < 3){
    wizardStep++;
    renderWizard();
    return;
  }
  try{
    await post('/api/setup/done', {});
  }catch(_){}
  $('#wizard').classList.remove('open');
  wizardShown = true;
  tick();
}

/* ================= 初始化 ================= */
const PRESETS=['#00A8FF','#8B5CF6','#FF4D5E','#FFB020','#2FD48A','#FF2D95','#FFFFFF','#00FFC6'];

function initUI(){
  initTheme();
  buildModes();
  const pbox=$('#presets');
  PRESETS.forEach(c=>{
    const b=document.createElement('div');
    b.className='preset'; b.style.background=c; b.title=c; b.tabIndex=0;
    b.onclick=()=>{
      state.color=c;
      $('#mainSwatch').style.background=c;
      $('#hex').value=c.toUpperCase();
      Object.keys(state.zones).forEach(k=>{ state.zones[k].color=c; });
      pushRecent(c); push();
    };
    pbox.appendChild(b);
  });

  const openMain=()=>openPicker('global', state.color, '作用于所有未单独配色的灯区');
  $('#mainSwatch').onclick=openMain;
  $('#mainSwatch').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openMain(); } };

  $('#hex').onchange=()=>{
    const n=hexNorm($('#hex').value);
    if(n){ state.color=n; $('#mainSwatch').style.background=n; $('#hex').value=n.toUpperCase(); push(); }
    else $('#hex').value=state.color.toUpperCase();
  };

  ['brightness','speed'].forEach(id=>{
    const el=$('#'+id);
    setRangeFill(el);
    el.oninput=()=>{
      setRangeFill(el);
      $('#'+id+'Out').textContent = id==='brightness' ? el.value+'%' : el.value;
    };
    el.onchange=push;
  });

  $('#reset').onclick=async ()=>{
    const r=await post('/api/reset',{});
    if(r.state){
      $('#brightness').value=r.state.brightness; setRangeFill($('#brightness'));
      $('#brightnessOut').textContent=r.state.brightness+'%';
      $('#speed').value=r.state.speed; setRangeFill($('#speed'));
      $('#speedOut').textContent=r.state.speed;
      state.color=r.state.color;
      $('#zones').dataset.sig='';
      render(r.state);
    }
  };

  buildPalette();
  renderRecent();

  // ---- 首次运行向导 ----
  $('#wzNext').onclick = wizardNext;
  $('#wzPrev').onclick = ()=>{ if(wizardStep > 1){ wizardStep--; renderWizard(); } };
  $('#wzClose').onclick = closeWizard;
  $('#reconfigure').onclick = ()=>{ wizardShown = true; openWizard(); };
}

async function tick(){
  try{
    const r=await fetch('/api/state');
    render(await r.json());
  }catch(_){}
}

initUI();
fetch('/api/state').then(r=>r.json()).then(s=>{
  $('#brightness').value=s.brightness; setRangeFill($('#brightness'));
  $('#brightnessOut').textContent=s.brightness+'%';
  $('#speed').value=s.speed; setRangeFill($('#speed'));
  $('#speedOut').textContent=s.speed;
  state.color=s.color;
  $('#hex').value=s.color.toUpperCase();
  $('#mainSwatch').style.background=s.color;
  render(s);
});
setInterval(tick,1000);
</script>
